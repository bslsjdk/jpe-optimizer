plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            // Attaches the continuous Rust world host to a real client (needs a display).
            // The library path points at the crate's release build; -Djpe.worldHost=true is
            // what actually turns the host on (see WorldEngineHost.ENABLE_PROPERTY). Without
            // a display this run type is unavailable, which is why the verified path in CI is
            // the bounded gameTestServer rig, not this one.
            systemProperty 'jpe.worldLibrary',
                    "${rootDir}/native/rust-world/target/release/libjpe_world.so"
            systemProperty 'jpe.worldHost', 'true'
            systemProperty 'jpe.worldRequired', 'false'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }

// Stage 6: the Java 25 FFM binding for the Rust world engine lives next to the
// crate so the standalone harness and Minecraft compile against exactly one copy.
// WorldEngineHarness is a dev tool with its own main() and stays out of the mod.
sourceSets {
    main {
        java {
            srcDir 'native/rust-world/java/src'
            exclude 'dev/jpe/world/WorldEngineHarness.java'
        }
    }
}

// Expand the mod metadata template and include it in the main source set.
// Without this, NeoForge sees the compiled classes directory but cannot
// discover META-INF/neoforge.mods.toml, so the development mod is rejected.
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)

// ---------------------------------------------------------------------------
// Native payload
//
// Two cdylibs ship inside the jar and are unpacked on first use:
//   libjpe_runtime  the density/perlin kernels
//   libjpe_world    the Rust world engine, which carries the C++ terrain
//                   generator when built with --features cpp-bridge
//
// They are read from a staging tree, native/bundled/<platform>/<file>, so the
// jar always packs exactly what the build produced, and one platform's build
// never overwrites another's. A cross-compiled matrix fills this tree; a local
// desktop build falls back to the crate target directories so a developer does
// not have to run the matrix to get a working jar.
//
// A dedicated server starts in its own working directory, so a relative
// target/ path cannot be resolved there. NativeLibraryLoader unpacks these
// resources into the JVM temporary directory instead.
// ---------------------------------------------------------------------------
def bundledNatives = layout.projectDirectory.dir('native/bundled')
def nativeFallbackDirs = [
        'jpe_runtime': layout.projectDirectory.dir('native/rust-runtime/target/release'),
        'jpe_world'  : layout.projectDirectory.dir('native/rust-world/target/release'),
]
def nativeFileNames = {
    String base, String platform ->
        platform.startsWith('windows') ? base + '.dll'
                : platform.startsWith('macos') ? 'lib' + base + '.dylib'
                : 'lib' + base + '.so'
}

/** Platforms the jar can carry a native payload for. */
ext.bundledPlatforms = ['linux-x86_64', 'linux-aarch64', 'macos-x86_64', 'macos-aarch64',
                        'windows-x86_64', 'android-aarch64']

// Collect what the jar will ship. Missing platforms are skipped, so a desktop
// build still produces a jar rather than failing on an absent cross target.
ext.collectNatives = { Directory target ->
    def produced = []
    ext.bundledPlatforms.each { platform ->
        nativeFileNames.keySet().each { base ->
            String name = nativeFileNames(base, platform)
            File staged = bundledNatives.dir(platform).file(name).asFile
            File source = staged.exists() ? staged
                    : nativeFallbackDirs[base].file(name).asFile
            if (source.exists()) {
                target.dir(platform).file(name).bytes = source.bytes
                produced << platform + '/' + name
            }
        }
    }
    return produced
}

def stagedNatives = layout.buildDirectory.dir('natives')
def stageNatives = tasks.register('stageNatives') {
    group = 'build'
    description = 'Collects the native payload that ships inside the mod jar.'
    def target = stagedNatives
    outputs.dir(target)
    doLast {
        def produced = ext.collectNatives(target.get())
        if (produced.isEmpty()) {
            logger.warn('jpe: no native payload found; the jar will ship without one')
        } else {
            produced.each { logger.lifecycle('jpe native: ' + it) }
        }
    }
}

tasks.named('processResources') {
    dependsOn stageNatives
    from(stagedNatives) {
        into 'META-INF/natives'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // NeoForge supplies FastUtil to the game runtime; plain Gradle tests need it explicitly.
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic Java worldgen-math microbenchmarks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.jpe.optimizer.benchmark.MathBenchmark'
    args = ['--warmup', '5', '--iterations', '20', '--samples', '262144']
}

// The optional Vector API implementation is loaded reflectively only after
// the runtime module probe succeeds; all startup-path classes stay scalar-safe.
tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

sourceSets {
    vectorBenchmark {
        java.srcDir 'src/vectorBenchmark/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
tasks.named('compileVectorBenchmarkJava', JavaCompile) {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

def vectorProbeJar = tasks.register('vectorProbeJar', Jar) {
    group = 'build'
    description = 'Packages the standalone Java 25 arithmetic and density-kernel probe.'
    dependsOn tasks.named('vectorBenchmarkClasses')
    archiveFileName = 'jpe-vector-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('vector-probe')
    from sourceSets.vectorBenchmark.output
    from(sourceSets.main.output) {
        include 'dev/jpe/optimizer/vector/DensityVectorKernel.class'
        include 'dev/jpe/optimizer/vector/DensityVectorKernel$BinaryOp.class'
        include 'dev/jpe/optimizer/vector/ScalarDensityKernel$1.class'
        include 'dev/jpe/optimizer/vector/VectorApiDensityKernel$1.class'
        include 'dev/jpe/optimizer/vector/ScalarDensityKernel.class'
        include 'dev/jpe/optimizer/vector/VectorApiDensityKernel.class'
    }
    manifest {
        attributes('Main-Class': 'dev.jpe.optimizer.benchmark.VectorApiBenchmark')
    }
}

tasks.register('vectorBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs arithmetic and branch-heavy density-kernel probes; requires the incubator module.'
    dependsOn vectorProbeJar
    classpath = files(vectorProbeJar.flatMap { it.archiveFile })
    mainClass = 'dev.jpe.optimizer.benchmark.VectorApiBenchmark'
    jvmArgs '--add-modules=jdk.incubator.vector'
    args = ['--warmup', '5', '--iterations', '20', '--samples', '262144']
}

tasks.named('check') { dependsOn tasks.named('benchmark') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
