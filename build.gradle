plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
    version = project.neo_version
    runs {
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir(generateModMetadata)

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic Java worldgen-math microbenchmarks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.jpe.optimizer.benchmark.MathBenchmark'
    args = ['--warmup', '5', '--iterations', '20', '--samples', '262144']
}
tasks.named('check') { dependsOn tasks.named('benchmark') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}