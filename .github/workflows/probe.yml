name: probe

# Temporary: bisect the native-terrain compile failure. Deleted once the cause
# is known. Each file is compiled alone with the same flags CI uses, so the
# failing translation unit and the first diagnostic are both visible.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: compile each unit separately
        working-directory: native/cpp-world
        run: |
          set +e
          CXX=g++
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -ffp-contract=off -fno-fast-math -fno-strict-aliasing -Iinclude -Isrc"
          for f in src/chunk_cache.cpp src/terrain_stream_api.cpp src/terrain_api.cpp src/generator.cpp; do
            echo "===== $f"
            $CXX $FLAGS -fsyntax-only "$f" 2>&1 | head -40
            echo "----- exit $?"
          done
      - name: test file alone
        working-directory: native/cpp-world
        run: |
          set +e
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -ffp-contract=off -fno-fast-math -fno-strict-aliasing -Iinclude -Isrc"
          echo "===== test/test_chunk_cache.cpp"
          g++ $FLAGS -fsyntax-only test/test_chunk_cache.cpp 2>&1 | head -60
      - name: header sanity
        working-directory: native/cpp-world
        run: |
          set +e
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -Iinclude -Isrc"
          printf '#include "chunk_cache.h"\nint main(){return 0;}\n' > /tmp/h.cpp
          g++ $FLAGS -fsyntax-only /tmp/h.cpp 2>&1 | head -40
          printf '#include "jpe_terrain_stream_api.h"\nint main(){return 0;}\n' > /tmp/h2.cpp
          g++ $FLAGS -fsyntax-only /tmp/h2.cpp 2>&1 | head -40
