name: rust terrain link

# Proves that the Rust runtime can actually reach the C++ world generator.
#
# The generator has always been reachable in principle -- the symbols are
# exported, the headers exist -- and unreachable in practice, because nothing
# in the Rust crate ever linked it. This workflow is the difference: it builds
# the crate with the generator compiled in, then runs a smoke test that
# generates a chunk through Rust and compares it against the same chunk served
# from the native cache.
#
# If this job is red, "Rust drives worldgen" is still a claim rather than a
# fact, and no layer above it can be trusted.

on:
  push:
    paths:
      - 'native/rust-runtime/**'
      - 'native/cpp-world/**'
      - '.github/workflows/rust-terrain-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: build + cache tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CXX=g++-13" >> "$GITHUB_ENV"
            echo "CC=gcc-13"  >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CC=clang"    >> "$GITHUB_ENV"
          fi

      - name: Compile library + tests
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          # -ffp-contract=off and -fno-fast-math are not optional here: the
          # generator promises bit-identical output against Minecraft's
          # float32 reference, and contraction changes rounding.
          CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Werror \
                    -ffp-contract=off -fno-fast-math -fno-strict-aliasing \
                    -Iinclude -Isrc"
          mkdir -p build
          echo "compiler: $($CXX --version | head -1)"
          $CXX $CXXFLAGS \
            src/generator.cpp \
            src/terrain_api.cpp \
            src/chunk_cache.cpp \
            src/terrain_stream_api.cpp \
            test/test_chunk_cache.cpp \
            -o build/test_chunk_cache -lpthread

      - name: Run cache tests
        working-directory: native/cpp-world
        run: ./build/test_chunk_cache

      - name: Build shared library
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Werror \
                    -ffp-contract=off -fno-fast-math -fno-strict-aliasing \
                    -fPIC -Iinclude -Isrc"
          $CXX $CXXFLAGS -shared \
            src/generator.cpp src/terrain_api.cpp \
            src/chunk_cache.cpp src/terrain_stream_api.cpp \
            -o build/libjpe_terrain.so -lpthread
          echo "--- exported streaming symbols ---"
          nm -D --defined-only build/libjpe_terrain.so \
            | grep -E 'jpe_terrain_(stream|acquire|release|cache)' || true

      - name: Verify streaming ABI is exported
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          # A missing export is a silent runtime failure in JNI/FFI code: the
          # host gets a null function pointer and the crash surfaces far from
          # the cause. Assert it here instead.
          for sym in \
            jpe_terrain_stream_abi_version \
            jpe_terrain_cache_config \
            jpe_terrain_stream \
            jpe_terrain_acquire \
            jpe_terrain_release \
            jpe_terrain_cache_stats \
            jpe_terrain_cache_clear \
            jpe_terrain_chunk_bytes
          do
            if ! nm -D --defined-only build/libjpe_terrain.so | grep -q " $sym$"; then
              echo "missing exported symbol: $sym"
              exit 1
            fi
          done
          echo "all streaming symbols exported"

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libjpe_terrain-${{ matrix.compiler }}
          path: native/cpp-world/build/libjpe_terrain.so
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # The other half of the claim.
  #
  # `build-and-test` proves the generator exports its symbols. It does not prove
  # anything in the Rust runtime can call them -- for a while it could not, and
  # `jpe_terrain_*` was a set of exports nothing linked against. This job builds
  # the crate with the generator compiled in and runs the tests that compare a
  # cached chunk against a directly generated one, so "Rust drives worldgen" is
  # a measured fact rather than an intended architecture.
  # ---------------------------------------------------------------------------
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust-runtime/target
          key: ${{ runner.os }}-terrain-link-${{ hashFiles('native/rust-runtime/Cargo.lock') }}

      - name: Show the ABI the C++ side actually exports
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          g++-13 -std=c++20 -O2 -fPIC -Iinclude -Isrc -shared \
            src/generator.cpp src/terrain_api.cpp \
            src/chunk_cache.cpp src/terrain_stream_api.cpp \
            -o /tmp/libjpe_terrain.so -lpthread
          echo "--- symbols the Rust binding declares ---"
          for sym in \
            jpe_terrain_abi_version jpe_terrain_default_config \
            jpe_terrain_create jpe_terrain_destroy \
            jpe_terrain_chunk_blocks jpe_terrain_generate_chunk \
            jpe_terrain_stream_abi_version jpe_terrain_cache_config \
            jpe_terrain_stream jpe_terrain_acquire jpe_terrain_release \
            jpe_terrain_cache_stats jpe_terrain_cache_clear \
            jpe_terrain_chunk_bytes
          do
            if nm -D --defined-only /tmp/libjpe_terrain.so | grep -q " $sym$"; then
              echo "ok   $sym"
            else
              echo "MISS $sym"
              exit 1
            fi
          done

      - name: Build the crate with the generator linked in
        working-directory: native/rust-runtime
        run: |
          set -euo pipefail
          cargo build --release 2>&1 | tail -40

      - name: Run the smoke test
        working-directory: native/rust-runtime
        run: |
          set +e -o pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci-out"
          cargo test --release --lib -- --test-threads=1 --nocapture > /tmp/terrain-tests.log 2>&1
          status=$?
          echo "=== cargo test exit: $status ==="
          grep -E "^(test |error|failures|---- )" /tmp/terrain-tests.log | head -60 || true
          echo "=== tail ==="
          tail -80 /tmp/terrain-tests.log
          cp /tmp/terrain-tests.log "${GITHUB_WORKSPACE}/ci-out/terrain-tests.log" 2>/dev/null || true
          exit $status

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-tests-log
          path: ci-out/terrain-tests.log
          if-no-files-found: warn

      - name: Report result
        if: always()
        run: |
          echo "rust-runtime built: ${{ job.status }}"
