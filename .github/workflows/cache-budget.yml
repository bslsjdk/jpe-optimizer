name: cache budget probe

# Answers "how much chunk cache fits in a 1G / 2G heap, and what view radius
# does that buy?" -- with the real allocator under a real cap, not with
# arithmetic on a napkin.
#
# The probe never copies chunk data out: it streams a window, touches every
# chunk, releases, and reads the counters. Peak RSS is therefore essentially
# the cache's own footprint, which is the number a host has to budget.
#
# Note on the cap: `ulimit -v` limits address space, not resident set. The
# C++ runtime reserves several hundred MB of address space it never touches
# (thread arenas, guard pages, the loader's own mappings), so a strict -v cap
# can kill the process before main() even runs. We therefore cap with -v at a
# deliberately generous multiple of the budget and let the probe's own
# ru_maxrss line decide whether the configuration fit.

on:
  push:
    paths:
      - 'native/cpp-world/bench/cache_budget_probe.cpp'
      - '.github/workflows/cache-budget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compile probe
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -fno-fast-math
                    -ffp-contract=off -Iinclude -Isrc"
          mkdir -p build
          g++-13 $CXXFLAGS \
            src/generator.cpp src/terrain_api.cpp \
            src/chunk_cache.cpp src/terrain_stream_api.cpp \
            bench/cache_budget_probe.cpp \
            -o build/cache_budget_probe -lpthread
          echo "compiled"
          ./build/cache_budget_probe 64 4 2 || echo "smoke_exit=$?"

      - name: Run probes
        working-directory: native/cpp-world
        run: |
          set -uo pipefail
          out=../../ci-out
          mkdir -p "$out"
          : > "$out/cache-budget.txt"

          # cap_kb budget_mb radius
          run() {
            local cap_kb=$1 budget=$2 radius=$3
            echo "##### cap=${cap_kb}KB budget=${budget}MB radius=${radius}"
            ( ulimit -v "$cap_kb"; exec ./build/cache_budget_probe "$budget" "$radius" 6 )
            local rc=$?
            echo "run_exit=$rc"
          }

          {
            echo "===== 1G heap: budget sweep at radius 20 ====="
            for b in 128 192 256 320 384; do
              run 3145728 "$b" 20
            done

            echo "===== 1G heap: radius sweep at 256MB ====="
            for r in 8 12 16 20 24 28; do
              run 3145728 256 "$r"
            done

            echo "===== 2G heap: budget sweep at radius 28 ====="
            for b in 384 512 640 768; do
              run 4194304 "$b" 28
            done
          } 2>&1 | tee -a "$out/cache-budget.txt"

      - name: Commit probe results
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git add -f ci-out/cache-budget.txt
          git commit -m "ci: cache budget probe results [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Echo summary
        if: always()
        run: |
          echo "=== RESULT lines ==="
          grep -E 'RESULT|run_exit|smoke_exit|FAIL' ci-out/cache-budget.txt || true