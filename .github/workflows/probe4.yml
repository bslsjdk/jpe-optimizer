name: probe4

on:
  workflow_dispatch:
  push:
    branches: [ work/rust-world-frame-budget ]
    paths:
      - '.github/workflows/probe4.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: try both compilers, dump output to repo
        run: |
          set +e
          OUT=/tmp/out.txt
          : > $OUT
          cd native/cpp-world
          for CXX in g++-13 g++ ; do
            echo "########## compiler: $CXX ##########" >> $OUT
            $CXX --version 2>&1 | head -1 >> $OUT
            FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -ffp-contract=off -fno-fast-math -fno-strict-aliasing -Iinclude -Isrc"
            echo "--- single TU: test_chunk_cache.cpp ---" >> $OUT
            $CXX $FLAGS -fsyntax-only test/test_chunk_cache.cpp >> $OUT 2>&1
            echo "exit=$?" >> $OUT
            echo "--- full link (exactly as CI) ---" >> $OUT
            $CXX $FLAGS src/generator.cpp src/terrain_api.cpp src/chunk_cache.cpp src/terrain_stream_api.cpp test/test_chunk_cache.cpp -o /tmp/t -lpthread >> $OUT 2>&1
            echo "exit=$?" >> $OUT
          done
          cd /home/runner/work/jpe-optimizer/jpe-optimizer
          mkdir -p ci-out
          cp $OUT ci-out/probe4.txt
          echo "size: $(wc -c < ci-out/probe4.txt)"
          git config user.name "probe-bot"
          git config user.email "probe@localhost"
          git add ci-out/probe4.txt
          git commit -m "ci: probe4 dual-compiler output" || echo "no change"
          git push || echo "push failed"