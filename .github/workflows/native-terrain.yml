name: native terrain v2

# The C++ world generator is a standalone library: no NeoForge, no Gradle, no
# JVM. It deserves a build that reflects that, so a change to the generator or
# the streaming cache gets an answer in about a minute instead of waiting
# behind the whole mod toolchain.
#
# Nothing here touches Minecraft. If these tests fail, the problem is in the
# terrain code and nowhere else -- which is exactly the property that makes a
# native rewrite worth doing.

on:
  push:
    paths:
      - 'native/cpp-world/**'
      - 'native/rust-runtime/**'
      - '.github/workflows/native-terrain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + cache tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CXX=g++-13" >> "$GITHUB_ENV"
            echo "CC=gcc-13"  >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CC=clang"    >> "$GITHUB_ENV"
          fi

      - name: Compile library + tests
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          # -ffp-contract=off and -fno-fast-math are not optional here: the
          # generator promises bit-identical output against Minecraft's
          # float32 reference, and contraction changes rounding.
          CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Werror \
                    -ffp-contract=off -fno-fast-math -fno-strict-aliasing \
                    -Iinclude -Isrc"
          mkdir -p build
          echo "compiler: $($CXX --version | head -1)"
          $CXX $CXXFLAGS \
            src/generator.cpp \
            src/terrain_api.cpp \
            src/chunk_cache.cpp \
            src/terrain_stream_api.cpp \
            test/test_chunk_cache.cpp \
            -o build/test_chunk_cache -lpthread

      - name: Run cache tests
        working-directory: native/cpp-world
        run: ./build/test_chunk_cache

      - name: Build shared library
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          CXXFLAGS="-std=c++20 -O2 -Wall -Wextra -Werror \
                    -ffp-contract=off -fno-fast-math -fno-strict-aliasing \
                    -fPIC -Iinclude -Isrc"
          $CXX $CXXFLAGS -shared \
            src/generator.cpp src/terrain_api.cpp \
            src/chunk_cache.cpp src/terrain_stream_api.cpp \
            -o build/libjpe_terrain.so -lpthread
          echo "--- exported streaming symbols ---"
          nm -D --defined-only build/libjpe_terrain.so \
            | grep -E 'jpe_terrain_(stream|acquire|release|cache)' || true

      - name: Verify streaming ABI is exported
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          # A missing export is a silent runtime failure in JNI/FFI code: the
          # host gets a null function pointer and the crash surfaces far from
          # the cause. Assert it here instead.
          for sym in \
            jpe_terrain_stream_abi_version \
            jpe_terrain_cache_config \
            jpe_terrain_stream \
            jpe_terrain_acquire \
            jpe_terrain_release \
            jpe_terrain_cache_stats \
            jpe_terrain_cache_clear \
            jpe_terrain_chunk_bytes
          do
            if ! nm -D --defined-only build/libjpe_terrain.so | grep -q " $sym$"; then
              echo "missing exported symbol: $sym"
              exit 1
            fi
          done
          echo "all streaming symbols exported"

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libjpe_terrain-${{ matrix.compiler }}
          path: native/cpp-world/build/libjpe_terrain.so
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # The other half of the claim.
  #
  # `build-and-test` proves the generator exports its symbols. It does not prove
  # anything in the Rust runtime can call them -- for a while it could not, and
  # `jpe_terrain_*` was a set of exports nothing linked against. This job builds
  # the crate with the generator compiled in and runs the tests that compare a
  # cached chunk against a directly generated one, so "Rust drives worldgen" is
  # a measured fact rather than an intended architecture.
  # ---------------------------------------------------------------------------
  rust-link:
    name: rust links the generator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust-runtime/target
          key: ${{ runner.os }}-terrain-link-${{ hashFiles('native/rust-runtime/Cargo.lock') }}

      # The C++ symbols are declared `unsafe extern "C"` in terrain_ffi.rs and
      # resolved at link time. A typo in one of those names produces a link
      # error naming the file, not the function, so the list is checked
      # explicitly against the built library first.
      - name: Verify every declared symbol is actually exported
        working-directory: native/cpp-world
        run: |
          set -euo pipefail
          mkdir -p build
          g++-13 -std=c++20 -O2 -fPIC -shared \
            -ffp-contract=off -fno-fast-math -fno-strict-aliasing \
            -Iinclude -Isrc \
            src/generator.cpp src/terrain_api.cpp \
            src/chunk_cache.cpp src/terrain_stream_api.cpp \
            -o build/libjpe_terrain.so -lpthread
          for sym in \
            jpe_terrain_abi_version \
            jpe_terrain_default_config \
            jpe_terrain_create \
            jpe_terrain_destroy \
            jpe_terrain_chunk_blocks \
            jpe_terrain_chunk_bytes \
            jpe_terrain_generate_chunk \
            jpe_terrain_stream_abi_version \
            jpe_terrain_cache_config \
            jpe_terrain_stream \
            jpe_terrain_acquire \
            jpe_terrain_release \
            jpe_terrain_cache_stats \
            jpe_terrain_cache_clear
          do
            if ! nm -D --defined-only build/libjpe_terrain.so | grep -q " $sym$"; then
              echo "declared in terrain_ffi.rs but not exported: $sym"
              exit 1
            fi
          done
          echo "all 14 declared symbols exported"

      - name: Build the runtime with the generator compiled in
        working-directory: native/rust-runtime
        run: |
          set -euo pipefail
          cargo build --release 2>&1 | tail -60

      # These are the tests that matter: cached_chunk_matches_direct_chunk
      # compares a chunk served from the cache with one generated straight from
      # the generator, element by element. If the FFI layout is wrong, that test
      # is where it shows up.
      - name: Terrain tests
        working-directory: native/rust-runtime
        run: |
          set +e -o pipefail
          cargo test --release --lib -- --test-threads=1 --nocapture > /tmp/terrain-tests.log 2>&1
          status=$?
          grep -E "^(test |error|failures|---- )" /tmp/terrain-tests.log | head -60 || true
          echo "=== tail ==="
          tail -60 /tmp/terrain-tests.log
          exit $status

      - name: Report
        if: always()
        run: echo "rust-runtime terrain link: ${{ job.status }}"
