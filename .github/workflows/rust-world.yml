name: Rust World Engine

on:
  push:
    branches: ["work/rust-world-engine"]
    paths:
      - "native/rust-world/**"
      - ".github/workflows/rust-world.yml"
  pull_request:
    paths:
      - "native/rust-world/**"
      - ".github/workflows/rust-world.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-world-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native/rust-world

jobs:
  test:
    name: Build and test (no GPU required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust-world

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test

      - name: Release unit tests
        run: cargo test --release

      # Formatting and lint are advisory for now: the local sandbox used to
      # develop this crate could not install rustfmt/clippy, so the first pass
      # has not been auto-formatted. Remove continue-on-error once normalized.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  gpu-backends:
    name: Native render backends on software Mesa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa software drivers
        run: |
          sudo apt-get update
          # libegl1 provides the `libEGL.so.1` SONAME; libgl1/libgles2 provide
          # `libGL.so.1`/`libGLESv2.so.2`; libvulkan1 is the Vulkan loader itself.
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri \
            libegl1 libgl1 libgles2 libglvnd0 libvulkan1

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust-world

      # Advisory: shows what the runner actually installed, so a driver/ICD
      # layout change is readable in the log instead of being an
      # "incompatible driver" code. Never fails the job.
      - name: GPU stack diagnostics (advisory)
        continue-on-error: true
        run: |
          dpkg -l | grep -Ei 'mesa|vulkan|egl|glvnd|gles' || true
          echo "--- manifests shipped by the installed packages ---"
          dpkg -L mesa-vulkan-drivers libegl1 libgl1 libgles2 libvulkan1 2>/dev/null \
            | grep -E '\.so|icd\.d' | sort || true
          echo "--- icd search directories ---"
          ls -l /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true
          ls -l /usr/lib/x86_64-linux-gnu/ | grep -Ei 'egl|glesv|libGL|vulkan' || true
          echo "--- any Vulkan env presets on the image ---"
          env | grep -Ei '^VK_|GALLIUM|LIBGL' || true

      # `JPE_REQUIRE_RENDER_BACKENDS=1` makes the backend tests fail (instead of
      # skipping) if a driver is missing, so this job proves Vulkan, GL and GLES
      # each created a device/context, rendered a frame, and can be driven over
      # the C ABI (the `ffi::tests::renderer_over_c_abi_*` test covers all three).
      - name: Tests including native backends (must not skip)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          XDG_RUNTIME_DIR: /tmp
          JPE_REQUIRE_RENDER_BACKENDS: "1"
        run: |
          # `ci/vulkan-icd.sh` points the loader at the lavapipe manifest this
          # Ubuntu release actually ships, instead of a hard-coded file name.
          icd="$(bash ci/vulkan-icd.sh)"
          if [ -n "$icd" ]; then export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"; fi
          VK_LOADER_DEBUG=all cargo test --lib -- --test-threads=1 --nocapture vulkan 2>&1 | tail -n 60 || true
          cargo test -- --test-threads=1

  java-bridge:
    name: Java 25 FFM bridge harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust-world

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Mesa software drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri \
            libegl1 libgl1 libgles2 libglvnd0 libvulkan1

      # Drives the Rust scheduler, mesher and a native GPU backend through the
      # C ABI with Java 25 FFM. No C++ library, no Minecraft: the only native
      # dependency is libjpe_world, which the script builds from source. With
      # `JPE_REQUIRE_RENDER_BACKENDS=1` the renderer section must not skip.
      - name: Build and run harness
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          XDG_RUNTIME_DIR: /tmp
          JPE_REQUIRE_RENDER_BACKENDS: "1"
        run: |
          icd="$(bash ci/vulkan-icd.sh)"
          if [ -n "$icd" ]; then export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"; fi
          java/run_harness.sh
