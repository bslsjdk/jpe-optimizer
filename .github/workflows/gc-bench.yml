name: GC Flags Benchmark

on:
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (HotSpot, same JRE family as ZL2's 25.0.5.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile GC harness
        run: |
          mkdir -p build/gc
          javac -d build/gc scripts/gc/GcStress.java
          java -version

      - name: Benchmark GC configurations
        run: |
          echo "=== GC comparison: tiny-object flood, phone-like -Xmx128m, heavy load ==="
          echo "Metrics: gcTotalMs (cumulative pause), gcCount, worstRoundMs (hitch), allocMbPerSec."
          echo "3 runs/config, report ALL. Lower worstRoundMs & gcTotalMs is better."
          echo "NOTE: x86 CI trend only; final choice must be A/B tested on the real phone."
          echo
          run_cfg() {
            local name="$1"; shift
            echo "--- CONFIG: $name | flags: $* ---"
            for i in 1 2 3; do
              java -Xms64m -Xmx128m "$@" -cp build/gc GcStress 300000 60 | tee -a "build/gc/$name.txt"
            done
            echo
          }
          run_cfg default
          run_cfg serial   -XX:+UseSerialGC
          run_cfg parallel -XX:+UseParallelGC
          run_cfg g1       -XX:+UseG1GC
          run_cfg g1_tuned -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:G1HeapRegionSize=1m -XX:InitiatingHeapOccupancyPercent=35
          run_cfg zgc      -XX:+UseZGC
          echo "=== SUMMARY (all runs) ==="
          grep -H GCRESULT build/gc/*.txt || true

      - name: Upload GC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-bench-${{ github.run_id }}
          path: build/gc/*.txt
          if-no-files-found: warn
          retention-days: 7