name: Full Chunk Native Perlin Benchmark

on:
  push:
    branches:
      - work/native-density-graph-ir
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-chunk-native-perlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build native runtime
        run: cargo build --release --manifest-path native/rust-runtime/Cargo.toml

      - name: Run native full-chunk comparison against the saved one-time Java baseline
        shell: bash
        env:
          NATIVE_LIBRARY: ${{ github.workspace }}/native/rust-runtime/target/release/libjpe_runtime.so
        run: |
          set -euo pipefail
          mkdir -p build/full-chunk-benchmark

          run_worldgen() {
            local label="$1"
            local options="$2"
            echo "===== FULL CHUNK WORLDGEN ${label} ====="
            rm -rf run
            mkdir -p run
            printf 'eula=true\n' > run/eula.txt
            cat > run/server.properties <<'PROPERTIES'
          level-seed=12648430
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          server-ip=127.0.0.1
          server-port=25566
          enable-query=false
          enable-rcon=false
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          max-tick-time=-1
          sync-chunk-writes=false
          PROPERTIES
            JAVA_TOOL_OPTIONS="--add-modules=jdk.incubator.vector ${options} -Djpe.benchmark.ticksPerColumn=22 -Djpe.continuousWorldgenBenchmark=true -Djpe.worldgenMetrics=true -Djpe.structureIndexMetrics=true -Djpe.structureIndexEnabled=false -Djpe.perlinVectorEnabled=false" \
              gradle runServer --no-daemon --stacktrace 2>&1 | tee "build/full-chunk-benchmark/${label}.log"
            grep -E 'JPE_CONTINUOUS_WORLDGEN_BENCH.*completedChunks=340.*failedChunks=0.*doFillCalls=([3-9][0-9]{2,}|[1-9][0-9]{3,})' "build/full-chunk-benchmark/${label}.log"
          }

          # FULL LevelChunks: 3 warmup rows, then 20 measured rows x 17 chunks = 340 chunks.
          # Reuse the saved Java scalar result; never spend another run on the baseline.
          cp benchmarks/baselines/full-chunk-java-scalar-12648430.log build/full-chunk-benchmark/java_scalar_baseline.log
          cat build/full-chunk-benchmark/java_scalar_baseline.log

          # The synchronous stack entry must execute on Minecraft's worldgen worker,
          # without queue submission, polling, or a second native worker pool.
          # Sweep the native dispatch cutoff on fresh worlds. The saved Java scalar
          # baseline is reused above; it is never rerun.
          for threshold in 64 128 256 512; do
            label="native_min${threshold}"
            run_worldgen "${label}" "-Djpe.nativePerlinEnabled=true -Djpe.nativePerlinSynchronous=true -Djpe.nativePerlinMinSamples=${threshold} -Djpe.nativeLibraryPath=${NATIVE_LIBRARY}"
          done

          # A control run isolates the positive-density Aquifer shortcut from the
          # native Perlin threshold sweep. It uses the same 128-sample cutoff.
          run_worldgen native_no_aquifer_skip "-Djpe.nativePerlinEnabled=true -Djpe.nativePerlinSynchronous=true -Djpe.nativePerlinMinSamples=128 -Djpe.disablePositiveDensityAquiferFastPath=true -Djpe.nativeLibraryPath=${NATIVE_LIBRARY}"

          # Tiny density volumes intentionally fall back to vanilla. Validate that
          # every run performs real native work and has no correctness/runtime failures.
          for label in native_min64 native_min128 native_min256 native_min512 native_no_aquifer_skip; do
            grep -E 'JPE_CONTINUOUS_WORLDGEN_BENCH.*mode=native-perlin-sync.*completedChunks=340.*failedChunks=0.*nativeCalls=[1-9][0-9]*.*nativeCompleted=[1-9][0-9]*.*nativeFallbacks=[0-9]+.*nativeSyncCalls=[1-9][0-9]*.*nativeInvalidDimensions=0.*nativeAxisMismatches=0.*nativeBufferMismatches=0.*nativeOversizedVolumes=0.*nativeRuntimeUnavailable=0.*nativeQueueRejections=0.*nativeJobFailures=0.*nativeExceptions=0' "build/full-chunk-benchmark/${label}.log"
          done

      - name: Upload full-chunk benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-chunk-native-perlin-${{ github.run_id }}
          path: build/full-chunk-benchmark/
          if-no-files-found: warn
          retention-days: 14
