name: JPE Optimizer CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unit correctness tests
        run: gradle test --no-daemon --stacktrace

      - name: Math microbenchmark
        run: |
          mkdir -p build/math-benchmark
          set -o pipefail
          gradle benchmark --no-daemon --stacktrace | tee build/math-benchmark/result.txt

      - name: Vector API scalar comparison and standalone JAR
        env:
          JAVA_TOOL_OPTIONS: --add-modules=jdk.incubator.vector
        run: |
          mkdir -p build/vector-probe
          set -o pipefail
          gradle vectorBenchmark --no-daemon --stacktrace | tee build/vector-probe/result.txt

      - name: GameTest correctness suite
        env:
          JAVA_TOOL_OPTIONS: -Djpe.structureIndexMetrics=true
        run: gradle runGameTestServer --no-daemon --stacktrace

      - name: Dedicated normal-world generation benchmark (ABBA, four fresh servers)
        run: |
          mkdir -p build/server-benchmark
          set -euo pipefail

          run_worldgen() {
            local label="$1"
            local index_enabled="$2"
            echo "===== NORMAL WORLDGEN BENCHMARK ${label} ====="
            rm -rf run/server
            mkdir -p run/server
            printf 'eula=true\n' > run/server/eula.txt
            cat > run/server/server.properties <<'PROPERTIES'
          level-seed=12648430
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          server-ip=127.0.0.1
          server-port=25566
          enable-query=false
          enable-rcon=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          sync-chunk-writes=false
          PROPERTIES
            JAVA_TOOL_OPTIONS="--add-modules=jdk.incubator.vector -Djpe.serverWorldgenBenchmark=true -Djpe.worldgenMetrics=true -Djpe.structureIndexMetrics=true -Djpe.structureIndexEnabled=${index_enabled}" \
              gradle runServer --no-daemon --stacktrace 2>&1 | tee "build/server-benchmark/${label}.log"
            grep 'JPE_SERVER_WORLDGEN_BENCH' "build/server-benchmark/${label}.log"
            grep -E 'generator=net\\.minecraft\\.world\\.level\\.levelgen\\.NoiseBasedChunkGenerator.*doFillCalls=[2-9][0-9]*' \
              "build/server-benchmark/${label}.log"
          }

          # ABBA order balances first/last-run bias. Every run gets a new normal world.
          run_worldgen baseline_a false
          run_worldgen indexed_a true
          run_worldgen indexed_b true
          run_worldgen baseline_b false

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Cache pinned Vineflower decompiler
        uses: actions/cache@v4
        with:
          path: build/source-audit/vineflower-1.12.0.jar
          key: vineflower-1.12.0-1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d

      - name: Verify and decompile exact Minecraft 26.3 artifacts
        run: python3 scripts/audit_minecraft_26_3_sources.py

      - name: Upload build, reports, and server benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpe-optimizer-ci-${{ github.run_id }}
          path: |
            build/libs/
            build/vector-probe/
            build/math-benchmark/
            build/server-benchmark/
            build/reports/tests/
            build/test-results/
            build/source-audit/report.txt
            run/server/logs/
          if-no-files-found: warn
          retention-days: 7
