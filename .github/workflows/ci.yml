name: JPE Optimizer CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unit correctness tests
        run: gradle test --no-daemon --stacktrace

      - name: Math microbenchmark
        run: gradle benchmark --no-daemon --stacktrace

      - name: Vector API scalar comparison and standalone JAR
        env:
          JAVA_TOOL_OPTIONS: --add-modules=jdk.incubator.vector
        run: |
          mkdir -p build/vector-probe
          set -o pipefail
          gradle vectorBenchmark --no-daemon --stacktrace | tee build/vector-probe/result.txt

      - name: Dedicated GameTestServer worldgen benchmark (ABBA, four fresh servers)
        run: |
          mkdir -p build/server-benchmark
          set -euo pipefail

          run_worldgen() {
            local label="$1"
            local java_options="$2"
            echo "===== WORLDGEN BENCHMARK ${label} ====="
            rm -rf run/gametest
            JAVA_TOOL_OPTIONS="${java_options}" gradle runGameTestServer --no-daemon --stacktrace 2>&1 | tee "build/server-benchmark/${label}.log"
            grep 'JPE_SERVER_WORLDGEN_BENCH' "build/server-benchmark/${label}.log"
          }

          # ABBA order balances first/last-run bias. Each invocation launches a
          # separate GameTestServer and deletes its prior world before starting.
          run_worldgen vector_a "--add-modules=jdk.incubator.vector"
          run_worldgen scalar_a "--add-modules=jdk.incubator.vector -Djpe.forceScalar=true"
          run_worldgen scalar_b "--add-modules=jdk.incubator.vector -Djpe.forceScalar=true"
          run_worldgen vector_b "--add-modules=jdk.incubator.vector"

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Cache pinned Vineflower decompiler
        uses: actions/cache@v4
        with:
          path: build/source-audit/vineflower-1.12.0.jar
          key: vineflower-1.12.0-1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d

      - name: Verify and decompile exact Minecraft 26.3 artifacts
        run: python3 scripts/audit_minecraft_26_3_sources.py

      - name: Upload build, reports, and server benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpe-optimizer-ci-${{ github.run_id }}
          path: |
            build/libs/
            build/vector-probe/
            build/server-benchmark/
            build/reports/tests/
            build/test-results/
            build/source-audit/report.txt
            run/gametest/logs/
          if-no-files-found: warn
          retention-days: 7
