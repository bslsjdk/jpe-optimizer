name: Native Perlin Worldgen Y Profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-perlin-y-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Record Rust toolchain version
        id: rust-version
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore native Rust and C++ build cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust-runtime/target
          key: ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('native/rust-runtime/Cargo.toml', 'native/rust-runtime/Cargo.lock') }}-${{ hashFiles('native/rust-runtime/build.rs', 'native/cpp-kernels/src/**', 'native/include/**') }}
          restore-keys: |
            ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('native/rust-runtime/Cargo.toml', 'native/rust-runtime/Cargo.lock') }}-
            ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Report native build cache status
        run: echo "JPE_NATIVE_BUILD_CACHE_HIT=${{ steps.native-cache.outputs.cache-hit }}"

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build native runtime
        run: cargo build --release --manifest-path native/rust-runtime/Cargo.toml

      - name: Generate one fixed-seed overworld and collect real Perlin Y runs
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: --add-modules=jdk.incubator.vector -Djpe.forceScalar=true -Djpe.nativePerlinEnabled=true -Djpe.nativePerlinProfile=true -Djpe.nativeLibraryPath=${{ github.workspace }}/native/rust-runtime/target/release/libjpe_runtime.so -Djpe.benchmark.ticksPerColumn=22 -Djpe.continuousWorldgenBenchmark=true -Djpe.worldgenMetrics=true -Djpe.structureIndexMetrics=true -Djpe.structureIndexEnabled=false -Djpe.perlinVectorEnabled=false
        run: |
          set -euo pipefail
          mkdir -p build/perlin-y-profile
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-seed=12648430
          level-type=minecraft:normal
          generate-structures=true
          online-mode=false
          server-ip=127.0.0.1
          server-port=25566
          enable-query=false
          enable-rcon=false
          spawn-protection=0
          view-distance=8
          simulation-distance=6
          max-tick-time=-1
          sync-chunk-writes=false
          PROPERTIES
          gradle runServer --no-daemon --stacktrace 2>&1 | tee build/perlin-y-profile/worldgen.log
          grep -E 'JPE_CONTINUOUS_WORLDGEN_BENCH.*completedChunks=340.*failedChunks=0' build/perlin-y-profile/worldgen.log
          grep 'JPE_PERLIN_Y_PROFILE' build/perlin-y-profile/worldgen.log | tee build/perlin-y-profile/y-runs.log
          test -s build/perlin-y-profile/y-runs.log

      - name: Upload Y-run profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-perlin-y-profile-${{ github.run_id }}
          path: |
            build/perlin-y-profile/
            run/logs/
          if-no-files-found: warn
          retention-days: 14
