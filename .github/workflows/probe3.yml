name: probe3

on:
  workflow_dispatch:
  push:
    branches: [ work/rust-world-frame-budget ]
    paths:
      - '.github/workflows/probe3.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: real compile and commit output
        run: |
          set +e
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -ffp-contract=off -fno-fast-math -fno-strict-aliasing -Iinclude -Isrc"
          OUT=/tmp/out.txt
          : > $OUT
          echo "### pwd" >> $OUT
          cd native/cpp-world
          pwd >> $OUT
          echo "### src" >> $OUT
          ls src include test >> $OUT 2>&1
          for f in src/chunk_cache.cpp src/terrain_stream_api.cpp src/terrain_api.cpp src/generator.cpp; do
            echo "" >> $OUT
            echo "===== $f =====" >> $OUT
            g++ $FLAGS -c $f -o /tmp/x.o >> $OUT 2>&1
            echo "exit=$?" >> $OUT
          done
          echo "" >> $OUT
          echo "===== link test =====" >> $OUT
          g++ $FLAGS src/chunk_cache.cpp src/terrain_stream_api.cpp src/terrain_api.cpp src/generator.cpp test/test_chunk_cache.cpp -o /tmp/t >> $OUT 2>&1
          echo "exit=$?" >> $OUT
          echo "" >> $OUT
          echo "===== link so + nm =====" >> $OUT
          g++ $FLAGS -shared -fPIC src/chunk_cache.cpp src/terrain_stream_api.cpp src/terrain_api.cpp src/generator.cpp -o /tmp/lib.so >> $OUT 2>&1
          echo "exit=$?" >> $OUT
          nm -D /tmp/lib.so 2>&1 | grep jpe_terrain >> $OUT
          cd /home/runner/work/jpe-optimizer/jpe-optimizer
          mkdir -p ci-out
          cp $OUT ci-out/probe3.txt
          echo "size: $(wc -c < ci-out/probe3.txt)"
          git config user.name "probe-bot"
          git config user.email "probe@localhost"
          git add ci-out/probe3.txt
          git commit -m "ci: probe3 compile output" || echo "no change"
          git push || echo "push failed"