name: Native Perlin Verification

on:
  push:
    branches: ["work/**"]
    paths:
      - "native/**"
      - ".github/workflows/native-perlin.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-perlin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-perlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-perlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Record Rust toolchain version
        id: rust-version
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore native Rust and C++ build cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust-runtime/target
          key: ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('native/rust-runtime/Cargo.toml', 'native/rust-runtime/Cargo.lock') }}-${{ hashFiles('native/rust-runtime/build.rs', 'native/cpp-kernels/src/**', 'native/include/**') }}
          restore-keys: |
            ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('native/rust-runtime/Cargo.toml', 'native/rust-runtime/Cargo.lock') }}-
            ${{ runner.os }}-native-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Report native build cache status
        run: echo "JPE_NATIVE_BUILD_CACHE_HIT=${{ steps.native-cache.outputs.cache-hit }}"

      - name: Run optimized native correctness tests and fixed-workload benchmark
        shell: bash
        run: |
          mkdir -p build/native-perlin
          set -o pipefail
          cargo test --release --manifest-path native/rust-runtime/Cargo.toml -- --nocapture 2>&1 | tee build/native-perlin/native-tests.log

      - name: Build native runtime
        run: cargo build --release --manifest-path native/rust-runtime/Cargo.toml

      - name: Upload native benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-perlin-${{ github.run_id }}
          path: build/native-perlin/native-tests.log
          if-no-files-found: warn
          retention-days: 14
