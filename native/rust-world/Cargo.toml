[package]
name = "jpe-world-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "JPE native world engine: chunk lifecycle, scheduling, mesh construction, and native Vulkan/OpenGL/OpenGL ES render backends."

[lib]
name = "jpe_world"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Link against the existing C++ terrain kernels (ABI v8) built by
# native/rust-runtime. Never changes the C++ ABI; it only declares it.
cpp-bridge = []

[profile.release]
lto = "thin"
codegen-units = 1
