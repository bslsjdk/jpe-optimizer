[package]
name = "jpe-world-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "JPE native world engine: chunk lifecycle, scheduling, mesh construction, and native Vulkan/OpenGL/OpenGL ES render backends."

[lib]
name = "jpe_world"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Link the native terrain generator (native/cpp-world) and the existing C++
# kernels (ABI v8). The build script compiles the generator into this crate when
# the feature is on; the default build stays pure Rust with zero C++.
cpp-bridge = []

[build-dependencies]
# Build-only: compiles native/cpp-world into the crate under `cpp-bridge`.
# Nothing is added to the runtime dependency graph.
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1

# This example imports `terrain_path`, which is `#[cfg(feature = "cpp-bridge")]`.
# Without `required-features` a plain `cargo build --all-targets` would try to
# compile it and fail on a missing module -- so the feature gate has to be
# declared here, not just on the module.
[[example]]
name = "native_terrain_world"
required-features = ["cpp-bridge"]
